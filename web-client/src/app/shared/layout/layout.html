<div class="layout-shell">
  <ng-container *ngIf="currentUser$ | async as currentUser; else loading">
    <app-sidebar [collapsed]="sidebarCollapsed()" [userRole]="mapUserRole(currentUser.role)"></app-sidebar>

    <div class="main-content" [class.expanded]="sidebarCollapsed()">
      <app-header
        [userName]="currentUser.name"
        [userRole]="currentUser.role"
        (toggleSidebar)="toggleSidebar()"
      ></app-header>
      <main class="content-area">
        <router-outlet></router-outlet>
      </main>
    </div>
  </ng-container>

  <ng-template #loading>
    <app-sidebar [collapsed]="sidebarCollapsed()" [userRole]="UserRole.CLIENT"></app-sidebar>
    <div class="main-content" [class.expanded]="sidebarCollapsed()">
      <app-header [userName]="'Loading...'" [userRole]="'Client'" (toggleSidebar)="toggleSidebar()"></app-header>
      <main class="content-area">
        <router-outlet></router-outlet>
      </main>
    </div>
  </ng-template>
</div>
