<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <h2>Create your client account</h2>
      <p>Only clients can self-register. Employee accounts are provisioned by administrators.</p>
    </div>

    <form class="register-form" (ngSubmit)="onSubmit()">
      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <div class="form-row">
        <div class="form-group half-width">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="userData.name" />
        </div>
        <div class="form-group half-width">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="userData.surname" />
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="userData.email" />
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" [(ngModel)]="userData.phone" />
        </div>
        <div class="form-group half-width">
          <label for="nationalId">National ID (CIN)</label>
          <input type="text" id="nationalId" name="nationalId" [(ngModel)]="userData.cin" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="userData.password" />
            <button type="button" class="eye-icon" (click)="showPassword = !showPassword" tabindex="-1">
              @if (!showPassword) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
              @if (showPassword) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              }
            </button>
          </div>
        </div>
        <div class="form-group half-width">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" />
            <button type="button" class="eye-icon" (click)="showConfirmPassword = !showConfirmPassword" tabindex="-1">
              @if (!showConfirmPassword) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              }
              @if (showConfirmPassword) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              }
            </button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <div class="signin-link">
      <p>Already have an account? <a routerLink="/auth/login">Sign in</a></p>
    </div>
  </div>
</div>
