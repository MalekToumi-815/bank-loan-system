spring.application.name=workflow-service

server.port=8085

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.discovery.register=true

spring.cloud.consul.discovery.prefer-ip-address=true

spring.config.import=optional:consul:${SPRING_CLOUD_CONSUL_HOST:localhost}:${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.config.format=yaml
spring.cloud.consul.config.data-key=data