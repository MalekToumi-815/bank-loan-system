spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${angular_app_url:http://localhost:4200} # Your Angular dev server URL
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
        add-to-simple-url-handler-mapping: true

# Frontend URL (from .env) - used by services that need the Angular app URL
angular_app_url: ${angular_app_url:http://localhost:4200}