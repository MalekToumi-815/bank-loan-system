jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/oauth_db
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:mlk123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Frontend URL (from .env) - used by services that need the Angular app URL
angular_app_url: ${angular_app_url:http://localhost:4200}