spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 3

  mail:
    host: ${MAILTRAP_HOST}
    port: ${MAILTRAP_PORT}
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# This allows Consul to hit the health check URL successfully
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
    
# Frontend URL (from .env) - used by services that need the Angular app URL
angular_app_url: ${angular_app_url:http://localhost:4200}