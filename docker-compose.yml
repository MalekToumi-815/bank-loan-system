version: '3.8'

networks:
  bank-network:
    driver: bridge

services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - bank-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - bank-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    networks:
      - bank-network

  # Helper service to auto-load YAML files into Consul KV on boot
  consul-init:
    image: hashicorp/consul:latest
    container_name: consul-init
    depends_on:
      - consul
    networks:
      - bank-network
    volumes:
      - ./infrastructure/consul-config:/consul-config
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Consul...';
      until nc -z consul 8500; do sleep 1; done;
      
      echo 'Populating Consul Key-Value store...';
      
      # Upload Local Profile Configs
      consul kv put -http-addr=http://consul:8500 config/application,local/data @/consul-config/local/application.yml
      consul kv put -http-addr=http://consul:8500 config/account-service,local/data @/consul-config/local/account-service.yml
      consul kv put -http-addr=http://consul:8500 config/credit-service,local/data @/consul-config/local/credit-service.yml
      consul kv put -http-addr=http://consul:8500 config/gateway-service,local/data @/consul-config/local/gateway-service.yml
      consul kv put -http-addr=http://consul:8500 config/notification-service,local/data @/consul-config/local/notification-service.yml
      consul kv put -http-addr=http://consul:8500 config/oauth-service,local/data @/consul-config/local/oauth-service.yml
      consul kv put -http-addr=http://consul:8500 config/workflow-service,local/data @/consul-config/local/workflow-service.yml

      # Upload Dev Profile Configs
      consul kv put -http-addr=http://consul:8500 config/application,dev/data @/consul-config/dev/application.yml
      consul kv put -http-addr=http://consul:8500 config/account-service,dev/data @/consul-config/dev/account-service.yml
      consul kv put -http-addr=http://consul:8500 config/credit-service,dev/data @/consul-config/dev/credit-service.yml
      consul kv put -http-addr=http://consul:8500 config/gateway-service,dev/data @/consul-config/dev/gateway-service.yml
      consul kv put -http-addr=http://consul:8500 config/notification-service,dev/data @/consul-config/dev/notification-service.yml
      consul kv put -http-addr=http://consul:8500 config/oauth-service,dev/data @/consul-config/dev/oauth-service.yml
      consul kv put -http-addr=http://consul:8500 config/workflow-service,dev/data @/consul-config/dev/workflow-service.yml

      echo 'Consul configuration loaded successfully!';"

  # ==========================================
  # MICROSERVICES
  # ==========================================
  gateway-service:
    build: ./services/gateway-service
    container_name: gateway-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - ANGULAR_APP_URL=${ANGULAR_APP_URL}
    depends_on:
      consul-init:
        condition: service_completed_successfully
    networks:
      - bank-network

  oauth-service:
    build: ./services/oauth-service
    container_name: oauth-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      consul-init:
        condition: service_completed_successfully
    networks:
      - bank-network

  account-service:
    build: ./services/account-service
    container_name: account-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      consul-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    networks:
      - bank-network

  credit-service:
    build: ./services/credit-service
    container_name: credit-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      consul-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks:
      - bank-network

  workflow-service:
    build: ./services/workflow-service
    container_name: workflow-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      consul-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    networks:
      - bank-network

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
    depends_on:
      consul-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    networks:
      - bank-network